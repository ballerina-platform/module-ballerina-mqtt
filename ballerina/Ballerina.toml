[package]
org = "ballerina"
name = "mqtt"
version = "1.4.2"
authors = ["ballerina"]
keywords = ["mqtt", "client", "messaging", "network", "pubsub", "iot", "Type/Connector", "Type/Trigger", "Name/MQTT", "Area/Built-in", "Area/Messaging"]
repository = "https://github.com/ballerina-platform/module-ballerina-mqtt"
icon = "icon.png"
distribution = "2201.12.0"
include = ["metadata/**"]

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "mqtt-native"
version = "1.4.2"
path = "../native/build/libs/mqtt-native-1.4.2-SNAPSHOT.jar"

[[platform.java21.dependency]]
groupId = "org.eclipse.paho"
artifactId = "org.eclipse.paho.mqttv5.client"
version = "1.2.5"
path = "./lib/org.eclipse.paho.mqttv5.client-1.2.5.jar"

[[platform.java21.dependency]]
groupId = "org.bouncycastle"
artifactId = "bcpkix-jdk18on"
version = "1.84"
path = "./lib/bcpkix-jdk18on-1.84.jar"

[[platform.java21.dependency]]
groupId = "org.bouncycastle"
artifactId = "bcutil-jdk18on"
version = "1.84"
path = "./lib/bcutil-jdk18on-1.84.jar"
